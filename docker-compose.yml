services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  odoo:
    image: odoo:18.0
    depends_on: [db]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports: ["8069:8069"]
    volumes:
      - ./custom_addons:/mnt/extra-addons
    command: >
      odoo -d test_odoo
           --init hlv_your_module
           --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
           --stop-after-init
           --log-level=debug
volumes:
  pgdata:
