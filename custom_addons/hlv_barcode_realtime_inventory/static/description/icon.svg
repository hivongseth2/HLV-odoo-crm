<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>

  <!-- Barcode bars (vertical lines) -->
  <g fill="white" opacity="0.95">
    <!-- Bar group centered vertically, occupying top 60% -->
    <rect x="18" y="28" width="4"  height="44" rx="1"/>
    <rect x="26" y="28" width="7"  height="44" rx="1"/>
    <rect x="37" y="28" width="3"  height="44" rx="1"/>
    <rect x="44" y="28" width="6"  height="44" rx="1"/>
    <rect x="54" y="28" width="4"  height="44" rx="1"/>
    <rect x="62" y="28" width="3"  height="44" rx="1"/>
    <rect x="69" y="28" width="7"  height="44" rx="1"/>
    <rect x="80" y="28" width="4"  height="44" rx="1"/>
    <rect x="88" y="28" width="3"  height="44" rx="1"/>
    <rect x="95" y="28" width="6"  height="44" rx="1"/>
    <rect x="105" y="28" width="5" height="44" rx="1"/>
  </g>

  <!-- Scanner line (red sweep line) -->
  <rect x="14" y="51" width="100" height="3" rx="1.5" fill="#F87171" opacity="0.9"/>

  <!-- Corner frame brackets -->
  <g stroke="white" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Top-left -->
    <path d="M14,88 L14,98 Q14,100 16,100 L26,100"/>
    <!-- Top-right -->
    <path d="M114,88 L114,98 Q114,100 112,100 L102,100"/>
  </g>

  <!-- Bottom text label area -->
  <rect x="24" y="108" width="80" height="12" rx="3" fill="white" opacity="0.2"/>
  <text x="64" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="white" opacity="0.9" letter-spacing="1">INVENTORY</text>
</svg>
