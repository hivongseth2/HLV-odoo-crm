# Cấu hình agent ghi hình — đặt cạnh hlv_pack_agent.py, đổi tên thành agent.yaml
#
# File này chứa mật khẩu camera và token Odoo. Đặt quyền đọc cho riêng tài khoản
# chạy service, đừng để trong thư mục dùng chung hay commit lên git.

# Địa chỉ Odoo. Thử ở staging trước khi đụng tới production.
odoo_url: "https://hoanglongvu-staging-v2-37103185.dev.odoo.com"

# Lấy ở Tồn kho > Cấu hình > Video đóng gói > Bàn đóng gói & camera
station_key: "BAN-XXXXXX"
token: "dán token của bàn này vào đây"

# Khoá bên trái phải TRÙNG cột "Mã camera" khai trong Odoo.
# subtype=0 là luồng chính (full độ phân giải). subtype=1 là luồng phụ, mờ —
# đừng dùng, đó đúng là lỗi đang làm video mờ ở bản quay bằng trình duyệt.
cameras:
  ngang: "rtsp://user:matkhau@192.168.1.10:554/cam/realmonitor?channel=1&subtype=0"
  tren: "rtsp://user:matkhau@192.168.1.11:554/cam/realmonitor?channel=1&subtype=0"

# Nơi để file tạm trong lúc ghi rồi gửi lên. Để trống thì dùng thư mục temp của máy.
# Chọn ổ còn nhiều chỗ: 1080p H.264 khoảng 30 MB mỗi phút mỗi camera.
work_dir: "D:/hlv_pack_rec"
