<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="20" fill="#0f1923"/>
  <rect x="8" y="8" width="112" height="112" rx="16" fill="#1a2733" stroke="#2a3a4a" stroke-width="1"/>
  <!-- Monitor screen -->
  <rect x="20" y="24" width="88" height="56" rx="6" fill="#0f1923" stroke="#00d4aa" stroke-width="2"/>
  <!-- Activity bars -->
  <rect x="30" y="62" width="8" height="12" rx="2" fill="#10b981"/>
  <rect x="42" y="56" width="8" height="18" rx="2" fill="#3b82f6"/>
  <rect x="54" y="50" width="8" height="24" rx="2" fill="#06b6d4"/>
  <rect x="66" y="44" width="8" height="30" rx="2" fill="#8b5cf6"/>
  <rect x="78" y="52" width="8" height="22" rx="2" fill="#f59e0b"/>
  <rect x="90" y="58" width="8" height="16" rx="2" fill="#f97316"/>
  <!-- Stand -->
  <rect x="48" y="82" width="32" height="4" rx="2" fill="#2a3a4a"/>
  <rect x="40" y="88" width="48" height="4" rx="2" fill="#2a3a4a"/>
  <!-- Pulse dot -->
  <circle cx="96" cy="32" r="4" fill="#00d4aa">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- AI icon placeholder -->
  <text x="64" y="110" text-anchor="middle" font-size="10" fill="#8899aa" font-family="sans-serif">MONITOR</text>
</svg>
