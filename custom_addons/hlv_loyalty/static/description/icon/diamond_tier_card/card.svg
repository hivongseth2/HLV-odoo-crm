  <line x1="20" y1="20" x2="100" y2="20" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="20" y2="80" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round"/>
  <text x="32" y="52" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="white" opacity="0.98" letter-spacing="2">DIAMOND</text>
  <circle cx="330" cy="50" r="35" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
